        const mockQuestions = [

            { id: 2, subject: "Português - Concordância", text: "Qual frase está estruturada de forma correta quanto à concordância verbal?", options: ["Fazem dez anos que a refinaria parou.", "Houveram muitos incidentes no poço.", "Devem haver novas vagas no concurso.", "Mais de um técnico assinaram o laudo.", "Existe, atualmente, grandes desafios."], correctAnswer: 2, explanation: "O verbo 'haver' (sentido de existir) é impessoal e transmite impessoalidade ao auxiliar: 'Deve haver novas vagas'." },

        // ==========================================

        function toggleComplete(id) {
            if (state.completed.includes(id)) {
                state.completed = state.completed.filter(i => i !== id);
            } else {
                state.completed.push(id);
            }
            localStorage.setItem('petroProgress2026', JSON.stringify(state.completed));
            renderApp();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function navigate(view, modKey = null) {
            state.view = view; 
            state.module = modKey;
            state.quiz = { active: false, current: 0, answers: {}, finished: false };
            if (window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
            renderApp();
        }

        // Funções do Quiz
        function startQuiz() { state.quiz.active = true; renderApp(); }
        function answerQuiz(idx) { state.quiz.answers[state.quiz.current] = idx; renderApp(); }
        function prevQuiz() { if(state.quiz.current > 0) state.quiz.current--; renderApp(); }
        function nextQuiz() { if(state.quiz.current < mockQuestions.length -1) state.quiz.current++; renderApp(); }
        function finishQuiz() { state.quiz.finished = true; renderApp(); }

        // ==========================================
        // 4. RENDERIZAÇÃO DA INTERFACE
        // ==========================================
        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            const grouped = {};
            Object.entries(courseModules).forEach(([k, v]) => {
                if (!grouped[v.category]) grouped[v.category] = [];
                grouped[v.category].push({ key: k, ...v });
            });

            let html = `<button onclick="navigate('dashboard')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${state.view === 'dashboard' ? 'bg-emerald-800' : 'hover:bg-emerald-800/50'}">
                <i class="fa-solid fa-chart-line text-sm w-5"></i><span class="text-sm font-medium">Dashboard</span></button>`;

            for (const [cat, mods] of Object.entries(grouped)) {
                html += `<div class="mt-6 mb-2 px-4 text-[10px] uppercase font-black tracking-widest text-emerald-500">${cat}</div>`;
                mods.forEach(m => {
                    // Ignora texto e pdf no cálculo se quisermos ser super rígidos, mas manter simple
                    const isDone = m.lessons.every(l => state.completed.includes(l.id));
                    html += `<button onclick="navigate('theory', '${m.key}')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition-all ${state.module === m.key ? 'bg-emerald-800 text-white shadow-inner' : 'text-emerald-100 hover:bg-emerald-800/30'}">
                        <i class="fa-solid ${isDone ? 'fa-circle-check text-yellow-400' : m.icon} text-sm w-5"></i>
                        <span class="text-sm truncate">${m.title}</span>
                    </button>`;
                });
            }
            
            html += `
                <div class="mt-6 mb-2 px-4 text-[10px] uppercase font-black tracking-widest text-emerald-500">Avaliação Oficial</div>
                <button onclick="navigate('simulados')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition-all ${state.view === 'simulados' ? 'bg-emerald-800 text-white shadow-inner' : 'text-emerald-100 hover:bg-emerald-800/30'}">
                    <i class="fa-solid fa-medal text-sm w-5"></i>
                    <span class="text-sm">Simulados Cesgranrio</span>
                </button>
            `;
            nav.innerHTML = html;
        }

        function renderApp() {
            renderSidebar();
            
            let videoCount = 0;
            let totalInteractiveItems = 0;
            
            Object.values(courseModules).forEach(m => {

            }).length;

            const perc = totalInteractiveItems === 0 ? 0 : Math.round((completedInteractive / totalInteractiveItems) * 100);

                    </div>

            } else if (state.view === 'simulados') {

                        <p class="text-gray-600 mb-8 text-sm md:text-base">5 Questões Quentes de provas reais (Português, Matemática, Informática e NR-33). Avalie seu conhecimento.</p>

                            <span class="text-xs md:text-sm font-black text-emerald-600 tracking-wider uppercase"><i class="fa-solid fa-pen mr-2 hidden md:inline"></i>Questão ${state.quiz.current + 1} / ${mockQuestions.length}</span>

                            </button>
                        </div>

                    const isDone = state.completed.includes(l.id);
                    
                    let icon = 'fa-file-lines text-emerald-600';

                                <button onclick="toggleComplete('${l.id}')" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-bold border transition-all ${isDone ? 'bg-emerald-100 text-emerald-800 border-emerald-300 hover:bg-emerald-200' : 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-200'}">
                                    ${isDone ? '<i class="fa-solid fa-check mr-1"></i> Concluído' : '<i class="fa-regular fa-circle mr-1"></i> Marcar'}
                                </button>
                            </div>
                        </div>`;
                    } else {
                        lessonsHtml += `<div class="w-full mt-4 pt-4 border-t border-gray-100 prose prose-emerald prose-sm max-w-none">${l.content}</div>`;
                    }
                });

                main.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6 animate-fade">
                    <div class="bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 class="text-2xl md:text-3xl font-black text-emerald-900 flex items-center"><i class="fa-solid ${mod.icon} mr-3 text-emerald-500"></i> ${mod.title}</h1>
                            <p class="text-gray-500 text-sm mt-2 font-medium">${mod.desc}</p>
                        </div>
                    </div>
                    
                    <div class="space-y-3">
                        <h3 class="text-sm font-black uppercase tracking-widest text-emerald-800 mb-4 pl-2 border-l-4 border-yellow-400">Trilha de Aprendizagem</h3>
                        ${lessonsHtml}
                    </div>
                </div>`;
            }
        }

        // --- PWA INSTALL SCRIPT ---
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install', (e) => { self.skipWaiting(); }); self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); }); self.addEventListener('fetch', (e) => { });`;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW Error', err));
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').classList.remove('hidden');
        });

        window.installApp = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-btn').classList.add('hidden');
                deferredPrompt = null;
            }
        };

        // RENDER INICIAL
        renderApp();
    </script>
</body>
</html>
